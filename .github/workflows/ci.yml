name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install -r webapp/requirements.txt pytest==9.1.1 httpx==0.28.1
      - name: Public-mode guarantees
        run: python -m pytest webapp/tests -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r webapp/requirements.txt --strict

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t maya-web .
      - name: Nothing personal in the image
        run: |
          ! docker run --rm maya-web sh -c 'find / -xdev \( -name ".env" -o -name ".spotify_token_cache" -o -name "health_profile.json" -o -path "*/users/*" -o -path "*/models/vosk*" \) -print 2>/dev/null' | grep .
      - name: Smoke test (public mode)
        run: |
          docker run -d --name maya -p 8000:8000 -e MAYA_MODE=public -e DEEPGRAM_API_KEY=placeholder maya-web
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/config | grep -q '"mode":"public"'
          curl -fsS -o /dev/null localhost:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/function -H 'content-type: application/json' -d '{"name":"trigger_emergency"}')" = 403
          curl -sI localhost:8000/ | grep -qi "content-security-policy"
          test "$(docker exec maya id -u)" = 10001
      - if: failure()
        run: docker logs maya || true
